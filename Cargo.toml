[package]
name = "rustgram-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Ergonomic async Telegram Bot API 10.4 library for Rust featuring HTML Widgets, Rich Messages, Ephemeral Messages, Guest Mode, Managed Bots, Router, and FSM."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lethemery/RustGram"
homepage = "https://lethemery.github.io/RustGram/"
documentation = "https://docs.rs/rustgram-api"
keywords = ["telegram", "bot", "bot-api", "async", "telegram-bot"]
categories = ["api-bindings", "asynchronous", "web-programming"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["rustls-tls", "webhook", "webapp"]
rustls-tls = ["reqwest/rustls-tls"]
webhook = ["dep:axum"]
webapp = ["dep:hmac", "dep:sha2", "dep:hex"]

[dependencies]
bytes = "1.12"
futures = "0.3"
mime_guess = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "charset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2.5"

# Optional webhook server support
axum = { version = "0.8", optional = true }

# Optional Telegram Mini App initData verification
hex = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tokio = { version = "1.54", features = ["full", "test-util"] }
tracing-subscriber = "0.3"

[[example]]
name = "fsm_webhook_bot"
required-features = ["webhook"]
