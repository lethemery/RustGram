name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build rustdoc API reference
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Assemble GitHub Pages site
        run: |
          rm -rf _site
          mkdir -p _site/api
          cp -r docs/. _site/
          cp -r target/doc/. _site/api/
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en">' \
            '<head>' \
            '  <meta charset="utf-8">' \
            '  <meta http-equiv="refresh" content="0; url=./rustgram/index.html">' \
            '  <title>rustgram API Reference</title>' \
            '</head>' \
            '<body>' \
            '  <p>Redirecting to <a href="./rustgram/index.html">rustgram API Reference</a>...</p>' \
            '</body>' \
            '</html>' > _site/api/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
